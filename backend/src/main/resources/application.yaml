spring:
  application:
    name: claimsift-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/claimsift}
    username: ${DB_USERNAME:claimsift}
    password: ${DB_PASSWORD:changeme}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

gemini:
  base-url: https://generativelanguage.googleapis.com/v1beta
  api-key: ${GEMINI_API_KEY}
  api-key-header: x-goog-api-key
  model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
  model-content-path: /models/{model}:generateContent
  max-claims-per-chunk: 3
  max-output-tokens: 1200

google:
  fact-check:
    base-url: https://factchecktools.googleapis.com/v1alpha1
    api-key: ${GOOGLE_FACT_CHECK_API_KEY}
    api-key-header: x-goog-api-key
    language-code: en
    page-size: 10
    claim-search-path: /claims:search

claimsift:
  fact-check:
    max-claims-per-video: 5
    max-google-queries-per-video: 5
    minimum-match-similarity: 0.25

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never